<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck — Descarga de YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="scene">

  <svg class="waveform" viewBox="0 0 320 32" preserveAspectRatio="none" aria-hidden="true">
    <g id="waveform-bars"></g>
  </svg>

  <main class="deck">
    <header class="deck-header">
      <h1>Deck</h1>
      <p class="subtitle">Pega un enlace de YouTube, elige el formato y descarga.</p>
    </header>

    <form id="search-form" class="search-row" autocomplete="off">
      <input
        type="url"
        id="url-input"
        name="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
      >
      <button type="submit" id="search-btn">
        <span class="btn-label">Buscar</span>
      </button>
    </form>

    <p id="error-msg" class="error-msg" hidden></p>

    <section id="track-card" class="track-card" hidden>
      <div class="track-info">
        <img id="track-thumb" class="track-thumb" alt="">
        <div class="track-meta">
          <h2 id="track-title"></h2>
          <p id="track-uploader" class="muted"></p>
        </div>
        <span id="track-duration" class="duration-badge"></span>
      </div>

      <div class="controls-row">
        <div class="segmented" id="format-toggle">
          <button type="button" class="segment active" data-format="mp3">MP3</button>
          <button type="button" class="segment" data-format="mp4">MP4</button>
          <span class="segment-highlight" aria-hidden="true"></span>
        </div>

        <select id="quality-select" class="quality-select" aria-label="Calidad"></select>
      </div>

      <button type="button" id="download-btn" class="download-btn">
        <span class="btn-label">Descargar</span>
      </button>
    </section>

    <p class="footnote">Solo para contenido que tengas derecho a descargar.</p>
  </main>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
